name: SailerTales model integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify-delivered-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify delivered models, reports and source fingerprints
        run: python sailertales/common/check_asset.py
